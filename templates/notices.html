{% extends "base.html" %}{% block title %}公告列表{% endblock %}{% block content %}<h2>系统公告</h2>{% for notice in notices %}<div class="card mb-3"><div class="card-body"><h5><a href="{{ url_for('notice_detail', notice_id=notice.id) }}">{{ notice.title }}</a></h5><small class="text-muted">{{ notice.created_at[:10] }}</small></div></div>{% else %}<p class="text-muted">暂无公告</p>{% endfor %}{% endblock %}
