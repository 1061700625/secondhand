{% extends "base.html" %} {% block title %}编辑个人资料{% endblock %} {% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">编辑个人资料</div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">昵称</label>
                        <input type="text" class="form-control" name="nickname" value="{{ user.nickname or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">个人简介</label>
                        <textarea class="form-control" name="intro" rows="3">{{ user.intro or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">性别</label>
                        <select class="form-select" name="gender">
                            <option value="">请选择</option>
                            <option value="male" {% if user.gender == 'male' %}selected{% endif %}>男</option>
                            <option value="female" {% if user.gender == 'female' %}selected{% endif %}>女</option>
                            <option value="other" {% if user.gender == 'other' %}selected{% endif %}>其他</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">所在地</label>
                        <input type="text" class="form-control" name="location" value="{{ user.location or '' }}">
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
