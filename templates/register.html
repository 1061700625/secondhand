{% extends "base.html" %} {% block title %}注册{% endblock %} {% block content %}
<div class="row justify-content-center">    <div class="col-6">        <div class="card">
            <div class="card-header">注册</div>            <div class="card-body">                <form method="post">
                    <div class="mb-3">                        <label class="form-label">用户名</label>                        <input type="text" class="form-control" name="username" required pattern="[a-zA-Z0-9]+" title="仅限英文字母和数字">                        <small class="form-text text-muted">仅限英文字母和数字，3-20字符</small>                    </div>
                    <div class="mb-3">                        <label class="form-label">昵称</label>                        <input type="text" class="form-control" name="nickname" placeholder="不填则使用用户名">                        <small class="form-text text-muted">显示名称， 可使用中文</small>                    </div>
                    <div class="mb-3">                        <label class="form-label">邮箱</label>                        <input type="email" class="form-control" name="email" required>                    </div>
                    <div class="mb-3">                        <label class="form-label">密码</label>                        <input type="password" class="form-control" name="password" required>                    </div>
                    <div class="mb-3">                        <label class="form-label">确认密码</label>                        <input type="password" class="form-control" name="confirm_password" required>                    </div>                    <button type="submit" class="btn btn-primary">注册</button>                </form>                <p class="mt-3">已有账号？<a href="{{ url_for('login') }}">登录</a></p>            </div>        </div>    </div></div>{% endblock %}
