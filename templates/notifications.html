{% extends "base.html" %}{% block title %}通知{% endblock %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2>我的通知</h2>{% if notifications %}<form method="post" action="{{ url_for('notification_clear_all') }}" onsubmit="return confirm('确定清空所有通知吗？')"><button type="submit" class="btn btn-sm btn-outline-secondary">一键清空</button></form>{% endif %}</div>{% for n in notifications %}<div class="alert alert-{{ 'info' if not n.is_read else 'secondary' }} {% if not n.is_read %}border{% endif %}"><p class="mb-1">{{ n.content }}</p><small class="text-muted">{{ n.created_at[:16] }}</small>{% if not n.is_read %}<form method="post" action="{{ url_for('notification_mark_read', notification_id=n.id) }}" style="display:inline"><button type="submit" class="btn btn-sm btn-link">标为已读</button></form>{% endif %}</div>{% else %}<p class="text-muted">暂无通知</p>{% endfor %}{% endblock %}
